# /etc/nginx/nginx.conf
# Generated for TradingAgents Viewer on Linode

user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Increase buffer for SSE streaming responses
    proxy_buffering         off;
    proxy_cache             off;

    # Gzip for static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    server {
        listen 80;
        server_name _;

        # ── Auth ──────────────────────────────────────────────────────────
        # .htpasswd is generated at startup from env vars by entrypoint.sh
        auth_basic           "TradingAgents";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # ── Static viewer ─────────────────────────────────────────────────
        root /var/www/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── API — standard JSON endpoints ─────────────────────────────────
        location /api/ {
            proxy_pass         http://127.0.0.1:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }

        # ── API — SSE streaming (analysis run progress) ───────────────────
        # Disable buffering so SSE events reach the browser immediately
        location /api/run {
            proxy_pass         http://127.0.0.1:8000/api/run;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   Cache-Control no-cache;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 900s;   # analyses can take 10-15 minutes
            chunked_transfer_encoding on;
        }
    }
}
