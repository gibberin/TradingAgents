# Local development / build-from-source compose. No Caddy, no TLS, no Basic
# Auth — just the api container built from this directory's Dockerfile,
# published directly on 8000 so you can hit http://localhost:8000 while
# iterating. Production uses docker-compose.prod.yml instead (pulls a
# prebuilt GHCR image behind Caddy) — see DEPLOYMENT.md.
name: tradingagents-dev

secrets:
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
  finnhub_api_key:
    file: ./secrets/finnhub_api_key
  openai_api_key:
    file: ./secrets/openai_api_key
  google_api_key:
    file: ./secrets/google_api_key
  reddit_client_id:
    file: ./secrets/reddit_client_id
  reddit_client_secret:
    file: ./secrets/reddit_client_secret

services:
  api:
    build: .
    image: tradingagents-api:local
    container_name: tradingagents-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ${REPORTS_HOST_PATH:-./reports}:/data/reports
    secrets:
      - anthropic_api_key
      - finnhub_api_key
      - openai_api_key
      - google_api_key
      - reddit_client_id
      - reddit_client_secret
    environment:
      REPORTS_PATH:       /data/reports
      TRADINGAGENTS_PATH: /app/TradingAgents
      PYTHONUNBUFFERED:   "1"
      REDDIT_USER_AGENT:  ${REDDIT_USER_AGENT:-tradingagents-deploy}
